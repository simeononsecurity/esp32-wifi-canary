; Experimental build target. ESP32-C5 support comes from pioarduino.
; This build does not claim verified 5 GHz capture behavior.
[env:lilygo-t-dongle-c5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = lilygo-t-dongle-c5
framework = arduino
monitor_speed = 115200
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11.tar.xz
    framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11-libs.tar.xz
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit NeoPixel@^1.15.1
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DCANARY_BOARD_T_DONGLE_C5
build_src_filter = +<main.cpp>
board_build.partitions = partitions_4mb.csv
